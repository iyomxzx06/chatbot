<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chatbot</title>
<style>
  :root {
    --bg: #eef3f6;
    --ink: #14232b;
    --muted: #5d7380;
    --card: #ffffff;
    --accent: #1b6fd1;
    --line: #d5e0e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
  }
  .chat {
    width: 100%;
    max-width: 480px;
    height: min(640px, 92vh);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    font-weight: 700;
  }
  header small { display: block; font-weight: 400; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bot { background: var(--bg); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    padding: 0 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <main class="chat">
    <header>My Chatbot <small>Ask me anything</small></header>
    <div id="messages">
      <div class="msg bot">Hi! Ano ang maitutulong ko sa'yo?</div>
    </div>
    <form id="form">
      <input id="input" placeholder="Type your message..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  // Keeps the conversation so the bot remembers earlier messages
  const history = [];

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", text });
    input.value = "";
    send.disabled = true;
    const thinking = addMessage("...", "bot");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      thinking.textContent = data.reply;
      history.push({ role: "model", text: data.reply });
    } catch (err) {
      // No backend yet (for example, opening this file directly): show a demo reply
      thinking.textContent = "Demo mode: wala pang backend na nakakonekta. Pag na-deploy na sa Vercel, dito lalabas ang sagot ng AI.";
    }
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
